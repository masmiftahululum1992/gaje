<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Presensi QR Code - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 35%, #94a3b8 75%, #e2e8f0 100%); background-attachment: fixed; }
        @keyframes popupAnim { 0% { opacity: 0; transform: scale(0.6) translateY(40px); } 70% { transform: scale(1.04) translateY(-8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .animate-popup { animation: popupAnim 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .welcome-exit { opacity: 0 !important; transform: scale(0.9) translateY(-20px) !important; pointer-events: none; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center selection:bg-blue-300 selection:text-blue-900">

    <!-- POPUP LOGIN SEKOLAH -->
    <div id="login-modal" class="fixed inset-0 z-[300] flex items-center justify-center bg-slate-950/90 backdrop-blur-2xl p-4">
        <div class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 border border-blue-500/30 rounded-3xl p-6 sm:p-10 max-w-md w-full text-center shadow-[0_0_60px_rgba(59,130,246,0.35)] animate-popup relative overflow-hidden">
            <div class="mx-auto w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/40 mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-xl sm:text-2xl font-black text-white uppercase tracking-tight mb-1">Otentikasi Akses</h2>
            <p class="text-xs text-slate-300 font-semibold mb-6">MAS Miftahul Ulum Lenteng</p>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">ID Login Sekolah</label>
                    <input type="text" id="login-id" required placeholder="Masukkan ID" class="w-full p-3 bg-white/90 border border-slate-300 rounded-xl text-sm font-bold text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Password</label>
                    <input type="password" id="login-pass" required placeholder="Masukkan Password" class="w-full p-3 bg-white/90 border border-slate-300 rounded-xl text-sm font-bold text-slate-800">
                </div>
                <div id="login-error" class="hidden text-xs font-bold text-rose-400 bg-rose-950/50 border border-rose-800 p-2.5 rounded-xl text-center"></div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold py-3.5 rounded-2xl shadow-xl transition-all text-sm uppercase">Masuk Website</button>
            </form>
        </div>
    </div>

    <!-- POPUP WELCOME -->
    <div id="welcome-modal" class="fixed inset-0 z-[150] flex items-center justify-center bg-slate-950/80 backdrop-blur-xl p-4 hidden">
        <div class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 border border-blue-500/30 rounded-3xl p-6 sm:p-10 max-w-lg w-full text-center shadow-[0_0_60px_rgba(59,130,246,0.35)] animate-popup">
            <h1 class="text-xl md:text-3xl font-black text-white uppercase mb-3">Selamat Datang</h1>
            <p class="text-sm text-slate-300 font-semibold mb-8">Sistem Informasi Presensi Digital & Realtime KBM</p>
            <button onclick="goToHome()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-3.5 px-6 rounded-2xl text-sm uppercase transition-all">Masuk Ke Dashboard</button>
        </div>
    </div>

    <script>
        // Cek jika sudah login
        if(sessionStorage.getItem('auth_token')) window.location.href = 'home.html';

        function handleLogin(e) {
            e.preventDefault();
            const idInput = document.getElementById('login-id').value.trim();
            const passInput = document.getElementById('login-pass').value.trim();
            
            if (idInput === "MASMIFTAHULULUM1992" && passInput === "GURUMA2026") {
                sessionStorage.setItem('auth_token', 'verified');
                document.getElementById('login-modal').classList.add('welcome-exit');
                setTimeout(() => {
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('welcome-modal').classList.remove('hidden');
                }, 400);
            } else {
                document.getElementById('login-error').innerText = "ID Sekolah atau Password Salah!";
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function goToHome() {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
